[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "varflash"
version = "0.1.0"
description = "AI VAR proof of concept: computer vision on soccer video, backtested against Kalshi prediction-market prices."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=14",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "scikit-learn>=1.4",
    "opencv-python>=4.9",
]

[project.optional-dependencies]
vision = ["torch>=2.2", "ultralytics>=8.3"]
spotting = ["torch>=2.2", "torchvision>=0.17", "SoccerNet>=0.1.60", "h5py>=3.10"]
dev = ["pytest>=8"]

[project.scripts]
varflash = "varflash.cli:main"

[tool.setuptools.packages.find]
include = ["varflash*"]

[tool.setuptools.package-data]
"varflash.replay" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
